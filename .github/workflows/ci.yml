name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Linter & Formatter
        run: bunx biome ci .

      - name: Run Type Checking
        run: bun run typecheck

      - name: Verify Production Build
        run: bun run build

      - name: SEO Checks (titles, h1, canonical, JSON-LD, links, sitemap)
        run: bun run seo:check

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  lighthouse:
    name: Lighthouse (SEO, performance, accessibility)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@latest autorun --config=./lighthouserc.json
